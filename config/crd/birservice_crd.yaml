apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  name: birservices.deploy.easydeploy.io
spec:
  group: deploy.easydeploy.io
  scope: Namespaced
  names:
    plural: birservices
    singular: birservice
    kind: BirService
    shortNames:
      - bs
  versions:
    - name: v1alpha1
      served: true
      storage: true
      subresources:
        status: {}
      additionalPrinterColumns:
        - name: Repo
          type: string
          jsonPath: .spec.repo
        - name: Image
          type: string
          jsonPath: .spec.image
        - name: Port
          type: integer
          jsonPath: .spec.port
        - name: Hostname
          type: string
          jsonPath: .spec.hostname
        - name: Available
          type: integer
          jsonPath: .status.availableReplicas
        - name: Build
          type: string
          jsonPath: .status.buildStatus
        - name: Canary
          type: integer
          jsonPath: .spec.canary.weight
      schema:
        openAPIV3Schema:
          type: object
          properties:
            apiVersion:
              type: string
            kind:
              type: string
            metadata:
              type: object
            spec:
              type: object
              properties:
                image:
                  type: string
                repo:
                  type: string
                tag:
                  type: string
                imageTag:
                  type: string
                  description: Rollback override — previous build SHA (e.g. abc1234).
                dockerfile:
                  type: string
                injectPipeline:
                  type: boolean
                  description: When true, adds GitHub Actions build workflow to the repo. Requires GITHUB_TOKEN.
                replicas:
                  type: integer
                  format: int32
                  minimum: 0
                  description: Ignored when spec.hpa.minReplicas/maxReplicas are set.
                hpa:
                  type: object
                  description: HPA format.
                  properties:
                    minReplicas:
                      type: integer
                      format: int32
                      minimum: 1
                    maxReplicas:
                      type: integer
                      format: int32
                      minimum: 1
                resources:
                  type: object
                  description: Container resource requests/limits.
                  properties:
                    requests:
                      type: object
                      properties:
                        memory:
                          type: string
                        cpu:
                          type: string
                    limits:
                      type: object
                      properties:
                        memory:
                          type: string
                        cpu:
                          type: string
                port:
                  type: integer
                  format: int32
                  minimum: 1
                  maximum: 65535
                containerPort:
                  type: integer
                  format: int32
                  minimum: 1
                  maximum: 65535
                hostname:
                  type: string
                hostnames:
                  type: array
                  items:
                    type: string
                  description: Additional public DNS aliases served by the same workload (one HTTPRoute, multiple hostnames). external-dns creates a record for each; all share the same pods and rate limit.
                expose:
                  type: boolean
                  description: If false, no HTTPRoute/DNS (internal only). Default true.
                metrics:
                  type: object
                  properties:
                    enabled:
                      type: boolean
                    path:
                      type: string
                      description: Metrics HTTP path, default /metrics
                canary:
                  type: object
                  description: Canary deployment with weighted HTTPRoute traffic splitting. Remove or set enabled=false to tear down.
                  properties:
                    enabled:
                      type: boolean
                    weight:
                      type: integer
                      format: int32
                      minimum: 0
                      maximum: 100
                      description: Percentage of traffic routed to canary (0-100). Default 10.
                    image:
                      type: string
                      description: Fully-qualified canary image. If empty, derived from spec.image + tag.
                    tag:
                      type: string
                      description: Image tag override for canary (e.g. v2.0.0-rc1).
                traffic:
                  type: object
                  description: Service mesh traffic (presence implies mesh intent). Local rate limit creates EnvoyFilter.
                  properties:
                    provider:
                      type: string
                      description: Mesh implementation; empty or istio — sidecar injection always on.
                    rateLimit:
                      type: object
                      properties:
                        enabled:
                          type: boolean
                        mode:
                          type: string
                          description: "local (Envoy sidecar) or global (not implemented)"
                        local:
                          type: object
                          properties:
                            requestsPerSecond:
                              type: integer
                              format: int32
                              minimum: 1
                            burst:
                              type: integer
                              format: int32
                              minimum: 0
                              description: Extra burst capacity added to token bucket max_tokens.
                    ejectUnhealthy:
                      type: boolean
                      description: "Outlier detection on/off (default true). Set false for workloads that legitimately return 5xx."
                    latencyAware:
                      type: boolean
                      description: "LB algorithm. Default false (round-robin). True switches to least-request (power-of-two-choices) — useful when request latency is heterogeneous (cache hits vs DB calls). Verify with P50/P99 histograms before enabling."
                readinessProbe:
                  type: object
                  description: HTTP readiness probe. Port defaults to container port.
                  properties:
                    path:
                      type: string
                    port:
                      type: integer
                      format: int32
                      minimum: 1
                      maximum: 65535
                livenessProbe:
                  type: object
                  description: HTTP liveness probe. Port defaults to container port.
                  properties:
                    path:
                      type: string
                    port:
                      type: integer
                      format: int32
                      minimum: 1
                      maximum: 65535
                shutdown:
                  type: object
                  description: Graceful termination tuning. terminationGracePeriodSeconds = preStopSleepSeconds + drainBufferSeconds.
                  properties:
                    preStopSleepSeconds:
                      type: integer
                      format: int32
                      minimum: 0
                      maximum: 600
                      description: Seconds the container sleeps before SIGTERM (drains endpoints from kube-proxy/Istio xDS/Gateway). Default 15.
                    drainBufferSeconds:
                      type: integer
                      format: int32
                      minimum: 0
                      maximum: 600
                      description: Post-SIGTERM budget for in-flight requests to finish before SIGKILL. Default 5. Increase for long requests (uploads, streaming).
                singleton:
                  type: boolean
                  description: App can only run one version at a time (leader-elected, exclusive lock, in-memory state). Default false → zero-downtime rolling deploy. True → old pods fully stop before new ones start (brief downtime), PDB skipped.
                maxDown:
                  type: integer
                  format: int32
                  minimum: 0
                  description: Maximum pods that may go down simultaneously during voluntary disruptions (node drains, upgrades). Default floor(replicas/2). Set lower for latency-critical apps. 0 forbids voluntary disruption (blocks node drains).
                route:
                  type: object
                  description: Shared-hostname routing across BirServices. Chart-populated from the tenant route block. child sets shareWith; parent gets members.
                  properties:
                    shareWith:
                      type: string
                      description: Full name of the parent BirService whose HTTPRoute/hostname to join. When set, this service creates no HTTPRoute of its own (child role).
                    pathPrefix:
                      type: string
                      description: Path prefix under the shared host that routes to this child (e.g. /testing). Authoritative copy lives in the parent's members.
                    weight:
                      type: integer
                      format: int32
                      minimum: 0
                      maximum: 100
                      description: Optional weighted-split percentage on the shared host's catch-all rule (used when pathPrefix is empty).
                    members:
                      type: array
                      description: Backends contributed by sharing children (parent role). Chart-populated.
                      items:
                        type: object
                        required: [service]
                        properties:
                          service:
                            type: string
                            description: Child ClusterIP Service name (e.g. hello-csharp-testing-svc).
                          pathPrefix:
                            type: string
                            description: When set, routes only this path prefix to the member (its own HTTPRoute rule).
                          weight:
                            type: integer
                            format: int32
                            minimum: 0
                            maximum: 100
                            description: When set and pathPrefix empty, adds the member as a weighted backend on the parent's catch-all rule.
            status:
              type: object
              properties:
                availableReplicas:
                  type: integer
                  format: int32
                buildImage:
                  type: string
                buildStatus:
                  type: string
                buildTag:
                  type: string
                lastRebuild:
                  type: string
                stableTag:
                  type: string
                  description: Image tag locked as stable when canary was enabled. Cleared on promotion.
                canaryImage:
                  type: string
                  description: Full image URL of the active canary deployment.

