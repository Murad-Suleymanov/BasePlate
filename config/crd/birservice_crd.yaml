apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  name: birservices.deploy.easydeploy.io
spec:
  group: deploy.easydeploy.io
  scope: Namespaced
  names:
    plural: birservices
    singular: birservice
    kind: BirService
    shortNames:
      - bs
  versions:
    - name: v1alpha1
      served: true
      storage: true
      subresources:
        status: {}
      additionalPrinterColumns:
        - name: Repo
          type: string
          jsonPath: .spec.repo
        - name: Image
          type: string
          jsonPath: .spec.image
        - name: Port
          type: integer
          jsonPath: .spec.port
        - name: Hostname
          type: string
          jsonPath: .spec.hostname
        - name: Available
          type: integer
          jsonPath: .status.availableReplicas
        - name: Build
          type: string
          jsonPath: .status.buildStatus
        - name: Canary
          type: integer
          jsonPath: .spec.canary.weight
      schema:
        openAPIV3Schema:
          type: object
          properties:
            apiVersion:
              type: string
            kind:
              type: string
            metadata:
              type: object
            spec:
              type: object
              properties:
                image:
                  type: string
                repo:
                  type: string
                tag:
                  type: string
                imageTag:
                  type: string
                  description: Rollback üçün əvvəlki SHA (məs. abc1234)
                dockerfile:
                  type: string
                injectPipeline:
                  type: boolean
                  description: When true, adds GitHub Actions build workflow to the repo. Requires GITHUB_TOKEN.
                replicas:
                  type: integer
                  format: int32
                  minimum: 0
                  description: Ignored when spec.hpa.minReplicas/maxReplicas are set.
                hpa:
                  type: object
                  description: HPA format.
                  properties:
                    minReplicas:
                      type: integer
                      format: int32
                      minimum: 1
                    maxReplicas:
                      type: integer
                      format: int32
                      minimum: 1
                resources:
                  type: object
                  description: Container resource requests/limits.
                  properties:
                    requests:
                      type: object
                      properties:
                        memory:
                          type: string
                        cpu:
                          type: string
                    limits:
                      type: object
                      properties:
                        memory:
                          type: string
                        cpu:
                          type: string
                port:
                  type: integer
                  format: int32
                  minimum: 1
                  maximum: 65535
                containerPort:
                  type: integer
                  format: int32
                  minimum: 1
                  maximum: 65535
                hostname:
                  type: string
                expose:
                  type: boolean
                  description: If false, no HTTPRoute/DNS (internal only). Default true.
                metrics:
                  type: object
                  properties:
                    enabled:
                      type: boolean
                    path:
                      type: string
                      description: Metrics HTTP path, default /metrics
                canary:
                  type: object
                  description: Canary deployment with weighted HTTPRoute traffic splitting. Remove or set enabled=false to tear down.
                  properties:
                    enabled:
                      type: boolean
                    weight:
                      type: integer
                      format: int32
                      minimum: 0
                      maximum: 100
                      description: Percentage of traffic routed to canary (0-100). Default 10.
                    image:
                      type: string
                      description: Fully-qualified canary image. If empty, derived from spec.image + tag.
                    tag:
                      type: string
                      description: Image tag override for canary (e.g. v2.0.0-rc1).
                traffic:
                  type: object
                  description: Service mesh traffic (presence implies mesh intent). Local rate limit creates EnvoyFilter.
                  properties:
                    provider:
                      type: string
                      description: Mesh implementation; empty or istio — sidecar injection always on.
                    rateLimit:
                      type: object
                      properties:
                        enabled:
                          type: boolean
                        mode:
                          type: string
                          description: "local (Envoy sidecar) or global (not implemented)"
                        local:
                          type: object
                          properties:
                            requestsPerSecond:
                              type: integer
                              format: int32
                              minimum: 1
                            burst:
                              type: integer
                              format: int32
                              minimum: 0
                              description: Extra burst capacity added to token bucket max_tokens.
                readinessProbe:
                  type: object
                  description: HTTP readiness probe. Port defaults to container port.
                  properties:
                    path:
                      type: string
                    port:
                      type: integer
                      format: int32
                      minimum: 1
                      maximum: 65535
                livenessProbe:
                  type: object
                  description: HTTP liveness probe. Port defaults to container port.
                  properties:
                    path:
                      type: string
                    port:
                      type: integer
                      format: int32
                      minimum: 1
                      maximum: 65535
            status:
              type: object
              properties:
                availableReplicas:
                  type: integer
                  format: int32
                buildImage:
                  type: string
                buildStatus:
                  type: string
                buildTag:
                  type: string
                lastRebuild:
                  type: string
                stableTag:
                  type: string
                  description: Image tag locked as stable when canary was enabled. Cleared on promotion.
                canaryImage:
                  type: string
                  description: Full image URL of the active canary deployment.

