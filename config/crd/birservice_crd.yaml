apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  name: birservices.deploy.easydeploy.io
spec:
  group: deploy.easydeploy.io
  scope: Namespaced
  names:
    plural: birservices
    singular: birservice
    kind: BirService
    shortNames:
      - bs
  versions:
    - name: v1alpha1
      served: true
      storage: true
      subresources:
        status: {}
      additionalPrinterColumns:
        - name: Repo
          type: string
          jsonPath: .spec.repo
        - name: Image
          type: string
          jsonPath: .spec.image
        - name: Port
          type: integer
          jsonPath: .spec.port
        - name: Hostname
          type: string
          jsonPath: .spec.hostname
        - name: Available
          type: integer
          jsonPath: .status.availableReplicas
        - name: Build
          type: string
          jsonPath: .status.buildStatus
      schema:
        openAPIV3Schema:
          type: object
          properties:
            apiVersion:
              type: string
            kind:
              type: string
            metadata:
              type: object
            spec:
              type: object
              properties:
                image:
                  type: string
                repo:
                  type: string
                tag:
                  type: string
                dockerfile:
                  type: string
                replicas:
                  type: integer
                  format: int32
                  minimum: 0
                port:
                  type: integer
                  format: int32
                  minimum: 1
                  maximum: 65535
                containerPort:
                  type: integer
                  format: int32
                  minimum: 1
                  maximum: 65535
                hostname:
                  type: string
            status:
              type: object
              properties:
                availableReplicas:
                  type: integer
                  format: int32
                buildImage:
                  type: string
                buildStatus:
                  type: string

