apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: nginx-gateway-fabric
  namespace: argocd
spec:
  project: default
  source:
    chart: nginx-gateway-fabric
    repoURL: ghcr.io/nginx/charts
    targetRevision: 2.4.2
    helm:
      releaseName: ngf
      values: |
        nginx:
          service:
            type: NodePort
            ports:
              - port: 80
                targetPort: 80
                protocol: TCP
                name: http
                nodePort: 30080
              - port: 443
                targetPort: 443
                protocol: TCP
                name: https
                nodePort: 30443
  destination:
    server: https://kubernetes.default.svc
    namespace: nginx-gateway
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      - ServerSideApply=true
