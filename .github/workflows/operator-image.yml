name: Build and push operator image

on:
  push:
    branches: ["main"]
    paths-ignore:
      # Bot bump-u yenidən build etməsin deyə
      - "charts/easy-deploy-platform/values.yaml"
  workflow_dispatch: {}

permissions:
  contents: write
  packages: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set lowercase owner
        shell: bash
        run: |
          echo "OWNER_LC=${GITHUB_REPOSITORY_OWNER,,}" >> "$GITHUB_ENV"

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.repository_owner }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          push: true
          platforms: linux/amd64
          tags: |
            ghcr.io/${{ env.OWNER_LC }}/easy-deploy-operator:main
            ghcr.io/${{ env.OWNER_LC }}/easy-deploy-operator:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # Chart default image (BasePlate). ArgoCD hələ də BasePlate-Infra-dakı
      # dev/platform/values/easy-deploy-platform-values.yaml və
      # prod/platform/values/easy-deploy-platform-values.yaml ilə override edə bilər — ora əl ilə və ya ayrı workflow ilə sync et.
      - name: Bump operator image in chart values
        shell: bash
        run: |
          set -euo pipefail
          NEW_IMAGE="ghcr.io/${OWNER_LC}/easy-deploy-operator:${GITHUB_SHA}"
          sed -i -E "s|image:[[:space:]]*ghcr.io/.*/easy-deploy-operator:.*$|image: ${NEW_IMAGE}|g" charts/easy-deploy-platform/values.yaml

      - name: Commit chart values update
        shell: bash
        run: |
          set -euo pipefail
          if git diff --quiet -- charts/easy-deploy-platform/values.yaml; then
            echo "No manifest changes detected"
            exit 0
          fi
          git add charts/easy-deploy-platform/values.yaml
          git -c user.name="github-actions[bot]" -c user.email="41898282+github-actions[bot]@users.noreply.github.com" \
            commit -m "chore(operator): bump image to ${GITHUB_SHA}"
          git push

