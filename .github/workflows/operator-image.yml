name: Build and push operator image

on:
  push:
    branches: ["main"]
    paths-ignore:
      # Skip when only the bot's auto-bump commit changed the file (avoids a build loop).
      - "charts/easy-deploy-platform/values.yaml"
  workflow_dispatch: {}

permissions:
  contents: write
  packages: write

jobs:
  build:
    runs-on: ubuntu-latest
    # The `secrets` context can't be used in step-level `if:`, so expose the PAT via env for the gating condition.
    env:
      BASEPLATE_INFRA_TOKEN: ${{ secrets.BASEPLATE_INFRA_TOKEN }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set lowercase owner
        shell: bash
        run: |
          echo "OWNER_LC=${GITHUB_REPOSITORY_OWNER,,}" >> "$GITHUB_ENV"

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.repository_owner }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          push: true
          platforms: linux/amd64
          tags: |
            ghcr.io/${{ env.OWNER_LC }}/easy-deploy-operator:main
            ghcr.io/${{ env.OWNER_LC }}/easy-deploy-operator:${{ github.sha }}
          # Registry cache (ghcr) — the GHA cache API occasionally returns "connection reset".
          cache-from: type=registry,ref=ghcr.io/${{ env.OWNER_LC }}/easy-deploy-operator:buildcache
          cache-to: type=registry,ref=ghcr.io/${{ env.OWNER_LC }}/easy-deploy-operator:buildcache,mode=max

      - name: Bump operator image in chart values (BasePlate)
        shell: bash
        run: |
          set -euo pipefail
          NEW_IMAGE="ghcr.io/${OWNER_LC}/easy-deploy-operator:${GITHUB_SHA}"
          sed -i -E "s|image:[[:space:]]*ghcr.io/.*/easy-deploy-operator:.*$|image: ${NEW_IMAGE}|g" charts/easy-deploy-platform/values.yaml

      - name: Commit BasePlate chart values update
        shell: bash
        run: |
          set -euo pipefail
          if git diff --quiet -- charts/easy-deploy-platform/values.yaml; then
            echo "No BasePlate chart changes"
            exit 0
          fi
          git add charts/easy-deploy-platform/values.yaml
          git -c user.name="github-actions[bot]" -c user.email="41898282+github-actions[bot]@users.noreply.github.com" \
            commit -m "chore(operator): bump image to ${GITHUB_SHA}"
          # The checkout is pinned to the SHA that triggered this run, so any commit landing
          # on main while the image built makes this push a non-fast-forward. Rebase and retry
          # instead of failing: dropping the bump would leave the cluster on the old operator
          # while main claims the new one, and the failure is silent until something misbehaves.
          for attempt in 1 2 3 4 5; do
            if git push; then
              exit 0
            fi
            echo "push rejected (attempt ${attempt}) — rebasing onto origin/main"
            git -c user.name="github-actions[bot]" -c user.email="41898282+github-actions[bot]@users.noreply.github.com" \
              pull --rebase origin main
          done
          echo "could not push the image bump after 5 attempts"
          exit 1

      # ArgoCD bu fayllardan oxuyur — token: repo Settings → Secrets → BASEPLATE_INFRA_TOKEN (PAT: BasePlate-Infra contents:write)
      - name: Checkout BasePlate-Infra
        if: ${{ env.BASEPLATE_INFRA_TOKEN != '' }}
        uses: actions/checkout@v4
        with:
          repository: ${{ github.repository_owner }}/BasePlate-Infra
          path: infra
          token: ${{ env.BASEPLATE_INFRA_TOKEN }}
          fetch-depth: 0

      - name: Bump operator image in Infra (dev + prod)
        if: ${{ env.BASEPLATE_INFRA_TOKEN != '' }}
        shell: bash
        run: |
          set -euo pipefail
          NEW_IMAGE="ghcr.io/${OWNER_LC}/easy-deploy-operator:${GITHUB_SHA}"
          for f in \
            infra/dev/platform/values/easy-deploy-platform-values.yaml \
            infra/prod/platform/values/easy-deploy-platform-values.yaml; do
            sed -i -E "s|image:[[:space:]]*ghcr.io/.*/easy-deploy-operator:.*$|image: ${NEW_IMAGE}|g" "$f"
          done

      - name: Commit and push BasePlate-Infra
        if: ${{ env.BASEPLATE_INFRA_TOKEN != '' }}
        shell: bash
        run: |
          set -euo pipefail
          cd infra
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add dev/platform/values/easy-deploy-platform-values.yaml prod/platform/values/easy-deploy-platform-values.yaml
          if git diff --cached --quiet; then
            echo "No Infra image line changes"
            exit 0
          fi
          git commit -m "chore(operator): bump image to ${GITHUB_SHA}"
          # Same race as the chart bump, and this is the one ArgoCD actually reads.
          for attempt in 1 2 3 4 5; do
            if git push; then
              exit 0
            fi
            echo "push rejected (attempt ${attempt}) — rebasing onto origin/main"
            git pull --rebase origin main
          done
          echo "could not push the Infra image bump after 5 attempts"
          exit 1
