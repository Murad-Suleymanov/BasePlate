apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: webhook-route
  namespace: easy-deploy-system
  annotations:
    external-dns.alpha.kubernetes.io/target: "178.104.84.100"
spec:
  parentRefs:
    - name: main-gateway
      namespace: nginx-gateway
      sectionName: https
  hostnames:
    - webhook-dev.easysolution.work
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /webhook
      backendRefs:
        - name: easy-deploy-webhook
          port: 9090
