apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: easy-deploy-platform-dev
  namespace: argocd
spec:
  project: default
  sources:
    - repoURL: https://github.com/Murad-Suleymanov/BasePlate
      targetRevision: HEAD
      path: manifests/crd
    - repoURL: https://github.com/Murad-Suleymanov/BasePlate
      targetRevision: HEAD
      path: manifests/operator/dev
  destination:
    name: dev-cluster
    namespace: easy-deploy-system
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
