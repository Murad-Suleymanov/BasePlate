# Operator reads GITHUB_TOKEN from ArgoCD repo credentials (fallback when github-pipeline-secret absent)
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: easy-deploy-read-argocd-repos
  namespace: argocd
rules:
  - apiGroups: [""]
    resources: ["secrets"]
    verbs: ["get", "list"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: easy-deploy-read-argocd-repos
  namespace: argocd
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: easy-deploy-read-argocd-repos
subjects:
  - kind: ServiceAccount
    name: easy-deploy-operator
    namespace: easy-deploy-system
