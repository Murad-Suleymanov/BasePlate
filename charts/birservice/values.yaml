name: ""

image: ""
repo: ""
tag: ""
dockerfile: ""
# imageTag: "abc1234"  # rollback üçün — əvvəlki SHA

port: 0
containerPort: 0
# replicas: sabit pod sayı. Yazılmasa və HPA yoxdursa default 1.
# replicas yazılıbsa HPA yaradılmır (replicas prioritetlidir).
hpa:
  # minReplicas + maxReplicas: HPA üçün (replicas yazılmayanda).
  minReplicas: 0
  maxReplicas: 0
resources:
  requests:
    # Yazılmasa default: memory=200Mi, cpu=75m
    memory: ""
    cpu: ""
  limits:
    # Yazılmasa default: requests-in 2 qatı
    memory: ""
    cpu: ""
hostname: ""

# expose: true = HTTPRoute + DNS (default), false = daxili ClusterIP.
expose: true

# Metrics: default true - hər komponent metrik yığır. false = söndür. Or { enabled: true, path: /actuator/prometheus }
metrics: true

# Mesh (Istio): traffic + provider boş/istio — injection məcburi (istio-injection=enabled).
# Mesh istəmirsənsə traffic yazma.
# traffic: {}
# traffic:
#   provider: istio
#   rateLimit:
#     enabled: true
#     mode: local
#     local:
#       requestsPerSecond: 100
#       burst: 20
# traffic: yazılmasa mesh idarəsi yoxdur; minimal mesh üçün: traffic: {}
#
# ejectUnhealthy: failing pod-ları müvəqqəti load balancer-dan çıxar (Istio outlier
# detection). Mesh aktiv olanda default true (5 ardıcıl 5xx → 30s eject, maks 50% pod).
# Yalnız 5xx qaytaran workload-lar üçün söndür (webhook, batch endpoint və s.):
# traffic:
#   ejectUnhealthy: false

# singleton: app eyni anda yalnız bir versiya işlədə bilərmi?
# Default false → zero-downtime rolling deploy (yeni pod ayağa qalxır, sonra köhnə ölür).
# true → köhnə pod-lar tam dayanır, sonra yeniləri başlayır (qısa downtime qəbul olunur).
# Yalnız o zaman true et ki, app həqiqətən exclusive resource tutur:
# leader-elected job, in-memory state olan worker, DB-yə exclusive lock tutan migration runner.
# singleton: true

# maxDown: node drain / cluster upgrade zamanı eyni anda maks neçə pod düşə bilər.
# Yazılmasa default replikaların yarısı (məs. replicas=4 → 2 pod düşə bilər).
# Latency-critical app üçün azalt: maxDown: 1 (yalnız 1 pod itki, yerdə qalanlar yükü daşıyır).
# Worker queue / eventually-consistent üçün artır.
# Ehtiyatlı ol: maxDown: 0 — heç bir voluntary disruption olmasın (node drain blok olur, cluster upgrade çətinləşir).
# maxDown: 1

# shutdown: graceful termination konfiqurasiyası.
# preStopSleepSeconds — SIGTERM-dən əvvəl saniyə (endpoint drain). Default 15.
# drainBufferSeconds — SIGTERM-dən sonra in-flight request-lər üçün vaxt. Default 5.
# terminationGracePeriodSeconds avtomatik = preStopSleepSeconds + drainBufferSeconds.
# Default kombinasiya: 15 + 5 = 20s grace.
# Uzun upload/streaming/batch üçün drainBufferSeconds-ı artır.
# shutdown:
#   preStopSleepSeconds: 30
#   drainBufferSeconds: 60

# Tracing is always on platform-wide via the OTel Operator. Runtime is auto-detected
# from the image (registry inspect / Dockerfile). No per-workload knobs.
