name: ""

image: ""
repo: ""
tag: ""
dockerfile: ""
# imageTag: "abc1234"  # rollback override — previous build SHA

port: 0
containerPort: 0
# replicas: fixed pod count. If omitted and HPA is not set, default is 1.
# If replicas is set, HPA is NOT created (replicas wins).
hpa:
  # minReplicas + maxReplicas: HPA (alternative to replicas).
  minReplicas: 0
  maxReplicas: 0
resources:
  requests:
    # Defaults when omitted: memory=200Mi, cpu=75m
    memory: ""
    cpu: ""
  limits:
    # Defaults when omitted: 2× requests
    memory: ""
    cpu: ""
hostname: ""

# expose: true = HTTPRoute + DNS (default), false = internal ClusterIP only.
expose: true

# metrics: default true = ServiceMonitor at /metrics. false = disabled.
# Object form: { enabled: true, path: /actuator/prometheus }
metrics: true

# Mesh (Istio ambient): presence of `traffic:` implies mesh intent.
# Provider empty or "istio" triggers the operator to label the namespace
# and ensure a waypoint Gateway. Omit the whole `traffic` block to stay
# out of the mesh.
# traffic: {}
# traffic:
#   provider: istio
#   rateLimit:
#     enabled: true
#     mode: local
#     local:
#       requestsPerSecond: 100
#       burst: 20
# For a minimal mesh opt-in with no extras: traffic: {}
#
# ejectUnhealthy: Istio outlier detection — temporarily removes failing pods
# from the load-balancing pool. Default true when mesh is enabled
# (5 consecutive 5xx → 30s eject, max 50% of pods).
# Set false for workloads that legitimately return 5xx (webhook receivers,
# batch endpoints with retries):
# traffic:
#   ejectUnhealthy: false
#
# latencyAware: load-balancer algorithm.
# false (default) → round-robin: every pod gets traffic in order. Correct for
#   stateless APIs with uniform request latency.
# true → least-request: each new request goes to the pod with the fewest
#   in-flight requests. Useful only when request latency is HETEROGENEOUS
#   (some endpoints hit cache, others hit DB). Verify P50/P99 histograms
#   in Grafana first — least-request usually helps when the ratio is > 5×.
# traffic:
#   latencyAware: true

# singleton: can the app run two versions concurrently?
# Default false → zero-downtime rolling deploy (new pod comes up Ready,
# then the old one terminates).
# true → all old pods stop fully before new ones start (brief downtime).
# Use only when the app genuinely holds an exclusive resource:
# leader-elected job, worker with in-memory state, migration runner with
# an exclusive DB lock.
# singleton: true

# maxDown: max pods that may go down simultaneously during voluntary
# disruptions (node drains, cluster upgrades, autoscaler removing nodes).
# Default: half the replicas (e.g. replicas=4 → 2 may go down).
# Lower for latency-critical apps: maxDown: 1 (only one pod lost at a time).
# Raise for eventually-consistent worker queues.
# Caution: maxDown: 0 forbids any voluntary disruption — node drains will
# block until pods reschedule, cluster upgrades become painful.
# maxDown: 1

# shutdown: graceful termination tuning.
# preStopSleepSeconds — seconds the container sleeps in preStop before
# receiving SIGTERM (endpoint drain). Default 15.
# drainBufferSeconds — post-SIGTERM budget for in-flight requests to
# finish before SIGKILL. Default 5.
# terminationGracePeriodSeconds is computed automatically as
# preStopSleepSeconds + drainBufferSeconds.
# Default combo: 15 + 5 = 20s grace.
# Increase drainBufferSeconds for long uploads, streaming, or batch work.
# shutdown:
#   preStopSleepSeconds: 30
#   drainBufferSeconds: 60

# Tracing is always on platform-wide via the OTel Operator. Runtime is auto-detected
# from the image (registry inspect / Dockerfile). No per-workload knobs.
