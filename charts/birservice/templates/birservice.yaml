apiVersion: deploy.easydeploy.io/v1alpha1
kind: BirService
metadata:
  name: {{ required "name is required" .Values.name | quote }}
  namespace: {{ .Release.Namespace | quote }}
  labels:
    app.kubernetes.io/managed-by: "argocd"
    deploy.easydeploy.io/tenant: {{ .Release.Namespace | quote }}
spec:
{{- if .Values.image }}
  image: {{ .Values.image | quote }}
{{- else }}
  repo: {{ required "repo is required when image is empty" .Values.repo | quote }}
  tag: {{ default "latest" .Values.tag | quote }}
{{- end }}
  replicas: {{ default 1 .Values.replicas }}
{{- if .Values.port }}
  port: {{ .Values.port }}
{{- end }}
{{- if .Values.containerPort }}
  containerPort: {{ .Values.containerPort }}
{{- end }}
{{- if .Values.hostname }}
  hostname: {{ .Values.hostname | quote }}
{{- end }}

