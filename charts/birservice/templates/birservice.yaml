apiVersion: deploy.easydeploy.io/v1alpha1
kind: BirService
metadata:
  name: {{ default .Release.Name .Values.name | quote }}
  namespace: {{ .Release.Namespace | quote }}
  labels:
    app.kubernetes.io/managed-by: "argocd"
    deploy.easydeploy.io/tenant: {{ .Release.Namespace | quote }}
spec:
{{- if .Values.image }}
  image: {{ .Values.image | quote }}
{{- end }}
{{- if .Values.repo }}
  repo: {{ .Values.repo | quote }}
{{- end }}
{{- if .Values.tag }}
  tag: {{ .Values.tag | quote }}
{{- end }}
{{- if .Values.imageTag }}
  imageTag: {{ .Values.imageTag | quote }}
{{- end }}
{{- if .Values.dockerfile }}
  dockerfile: {{ .Values.dockerfile | quote }}
{{- end }}
{{- $hpa := .Values.hpa | default dict }}
{{- $min := (get $hpa "minReplicas") | default 0 | int }}
{{- $max := (get $hpa "maxReplicas") | default 0 | int }}
{{- $replicasSet := or (kindIs "float64" .Values.replicas) (kindIs "int" .Values.replicas) }}
{{- $useHPA := and (gt $min 0) (gt $max 0) (not $replicasSet) }}
{{- $replicas := .Values.replicas | default 1 | int }}
{{- if not $useHPA }}
  replicas: {{ $replicas }}
{{- end }}
{{- if $useHPA }}
  hpa:
    minReplicas: {{ $min }}
    maxReplicas: {{ $max }}
{{- end }}
{{- $resources := .Values.resources | default dict }}
{{- $requests := (get $resources "requests") | default dict }}
{{- $limits := (get $resources "limits") | default dict }}
{{- $reqMem := ((get $requests "memory") | default "" | toString | trim) }}
{{- $reqCPU := ((get $requests "cpu") | default "" | toString | trim) }}
{{- $limMem := ((get $limits "memory") | default "" | toString | trim) }}
{{- $limCPU := ((get $limits "cpu") | default "" | toString | trim) }}
{{- if or $reqMem $reqCPU $limMem $limCPU }}
  resources:
{{- if or $reqMem $reqCPU }}
    requests:
{{- if $reqMem }}
      memory: {{ $reqMem | quote }}
{{- end }}
{{- if $reqCPU }}
      cpu: {{ $reqCPU | quote }}
{{- end }}
{{- end }}
{{- if or $limMem $limCPU }}
    limits:
{{- if $limMem }}
      memory: {{ $limMem | quote }}
{{- end }}
{{- if $limCPU }}
      cpu: {{ $limCPU | quote }}
{{- end }}
{{- end }}
{{- end }}
{{- if .Values.port }}
  port: {{ .Values.port }}
{{- end }}
{{- if .Values.containerPort }}
  containerPort: {{ .Values.containerPort }}
{{- end }}
{{- if .Values.hostname }}
  hostname: {{ .Values.hostname | quote }}
{{- end }}
{{- if ne (default true .Values.expose) true }}
  expose: false
{{- end }}
{{- /* Metrics default true - hər komponent metrik yığır; metrics: false ilə söndürülür */}}
{{- if or (and (eq (kindOf .Values.metrics) "bool") .Values.metrics) (and (eq (kindOf .Values.metrics) "map") (ne false .Values.metrics.enabled)) }}
  metrics:
    enabled: true
{{- if eq (kindOf .Values.metrics) "map" }}
    path: {{ default "/metrics" .Values.metrics.path | quote }}
{{- else }}
    path: "/metrics"
{{- end }}
{{- end }}
{{- if .Values.traffic }}
  traffic:
{{ toYaml .Values.traffic | nindent 4 }}
{{- end }}
{{- if .Values.canary }}
  canary:
{{ toYaml .Values.canary | nindent 4 }}
{{- end }}
{{- if .Values.readinessProbe }}
  readinessProbe:
{{ toYaml .Values.readinessProbe | nindent 4 }}
{{- end }}
{{- if .Values.livenessProbe }}
  livenessProbe:
{{ toYaml .Values.livenessProbe | nindent 4 }}
{{- end }}
{{- if .Values.strategy }}
  strategy:
{{ toYaml .Values.strategy | nindent 4 }}
{{- end }}
{{- if .Values.shutdown }}
  shutdown:
{{ toYaml .Values.shutdown | nindent 4 }}
{{- end }}
{{- if .Values.tracing }}
  tracing:
{{ toYaml .Values.tracing | nindent 4 }}
{{- end }}

