apiVersion: deploy.easydeploy.io/v1alpha1
kind: BirService
metadata:
  name: {{ default .Release.Name .Values.name | quote }}
  namespace: {{ .Release.Namespace | quote }}
  labels:
    app.kubernetes.io/managed-by: "argocd"
    deploy.easydeploy.io/tenant: {{ .Release.Namespace | quote }}
spec:
{{- if .Values.image }}
  image: {{ .Values.image | quote }}
{{- end }}
{{- if .Values.repo }}
  repo: {{ .Values.repo | quote }}
{{- end }}
{{- if .Values.tag }}
  tag: {{ .Values.tag | quote }}
{{- end }}
{{- if .Values.dockerfile }}
  dockerfile: {{ .Values.dockerfile | quote }}
{{- end }}
  replicas: {{ default 1 .Values.replicas }}
{{- if .Values.port }}
  port: {{ .Values.port }}
{{- end }}
{{- if .Values.containerPort }}
  containerPort: {{ .Values.containerPort }}
{{- end }}
{{- if .Values.hostname }}
  hostname: {{ .Values.hostname | quote }}
{{- end }}
{{- if ne (default true .Values.expose) true }}
  expose: false
{{- end }}
{{- if .Values.metrics }}
{{- if eq (kindOf .Values.metrics) "map" }}
  metrics:
    enabled: {{ default true .Values.metrics.enabled }}
    path: {{ default "/metrics" .Values.metrics.path | quote }}
{{- else if .Values.metrics }}
  metrics:
    enabled: true
    path: "/metrics"
{{- end }}
{{- end }}

