apiVersion: deploy.easydeploy.io/v1alpha1
kind: BirService
metadata:
  name: {{ default .Release.Name .Values.name | quote }}
  namespace: {{ .Release.Namespace | quote }}
  labels:
    app.kubernetes.io/managed-by: "argocd"
    deploy.easydeploy.io/tenant: {{ .Release.Namespace | quote }}
spec:
{{- if .Values.image }}
  image: {{ .Values.image | quote }}
{{- end }}
{{- if .Values.repo }}
  repo: {{ .Values.repo | quote }}
{{- end }}
{{- if .Values.tag }}
  tag: {{ .Values.tag | quote }}
{{- end }}
{{- if .Values.imageTag }}
  imageTag: {{ .Values.imageTag | quote }}
{{- end }}
{{- if .Values.dockerfile }}
  dockerfile: {{ .Values.dockerfile | quote }}
{{- end }}
{{- $min := .Values.minReplicas | default 0 | int }}
{{- $max := .Values.maxReplicas | default 0 | int }}
{{- $replicasSet := or (kindIs "float64" .Values.replicas) (kindIs "int" .Values.replicas) }}
{{- $useHPA := and (gt $min 0) (gt $max 0) (not $replicasSet) }}
{{- $replicas := .Values.replicas | default 1 | int }}
{{- if not $useHPA }}
  replicas: {{ $replicas }}
{{- end }}
{{- if $useHPA }}
  minReplicas: {{ $min }}
  maxReplicas: {{ $max }}
{{- end }}
{{- if .Values.port }}
  port: {{ .Values.port }}
{{- end }}
{{- if .Values.containerPort }}
  containerPort: {{ .Values.containerPort }}
{{- end }}
{{- if .Values.hostname }}
  hostname: {{ .Values.hostname | quote }}
{{- end }}
{{- if ne (default true .Values.expose) true }}
  expose: false
{{- end }}
{{- /* Metrics default true - hər komponent metrik yığır; metrics: false ilə söndürülür */}}
{{- if or (and (eq (kindOf .Values.metrics) "bool") .Values.metrics) (and (eq (kindOf .Values.metrics) "map") (ne false .Values.metrics.enabled)) }}
  metrics:
    enabled: true
{{- if eq (kindOf .Values.metrics) "map" }}
    path: {{ default "/metrics" .Values.metrics.path | quote }}
{{- else }}
    path: "/metrics"
{{- end }}
{{- end }}

