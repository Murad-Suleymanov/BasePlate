{{- /*
  This template emits either one BirService (single-instance, legacy shape) or N
  BirServices (multi-instance shape, one per top-level instance key).

  Single shape — values root has operational keys directly (hpa, resources, ...):
      hpa: {minReplicas: 1, maxReplicas: 3}
      resources: {...}
      → BirService named {{ .Release.Name }}

  Multi shape — values root has instance maps under arbitrary names, plus shared
  service-level fields (repo, owner) at root:
      repo: ...
      owner: ...
      main:  {hpa: ..., resources: ..., traffic: ...}
      slave: {hpa: ..., resources: ..., traffic: ...}
      → BirServices named {{ .Release.Name }}-main, {{ .Release.Name }}-slave

  Service-level fields (image, repo, tag, imageTag, dockerfile) are inherited by
  each instance unless the instance overrides them.

  An instance may also inherit the FULL config of a sibling instance via
  `inheritFrom: <name>` and override only the fields it declares (deep merge):
      main:  {hpa: {minReplicas: 1, maxReplicas: 2}, resources: ..., traffic: ...}
      slave: {inheritFrom: main, hpa: {maxReplicas: 4}}
      → slave is identical to main except hpa.maxReplicas = 4
*/ -}}
{{- $isMulti := eq (include "birservice.isMultiInstance" .Values) "true" -}}
{{- $owner := default "" .Values.owner | toString -}}

{{- if $isMulti -}}
{{- /* Inherited service-level fields propagate to each instance. */ -}}
{{- $shared := dict -}}
{{- range $k := list "image" "repo" "tag" "imageTag" "dockerfile" -}}
  {{- if hasKey $.Values $k -}}{{- $_ := set $shared $k (index $.Values $k) -}}{{- end -}}
{{- end -}}
{{- /* Known keys: all chart-defined fields. Anything outside this list AND is a map */}}
{{- /* is treated as an instance name. Defaults in values.yaml use known keys, so they */}}
{{- /* don't get mistaken for instances. */ -}}
{{- $knownKeys := list "name" "owner" "image" "repo" "tag" "imageTag" "dockerfile" "port" "containerPort" "replicas" "hpa" "resources" "hostname" "expose" "metrics" "traffic" "readinessProbe" "livenessProbe" "singleton" "maxDown" "shutdown" "canary" "injectPipeline" "route" -}}
{{- /* ── Shared-route pre-pass ──────────────────────────────────────────────
       Build $routeMembers: parent instance name -> list of member dicts, from the
       raw `route.shareWith` declared on child instances. References are validated
       here so a bad shareWith fails the render with a clear message (same rules the
       operator assumes). A child joins the parent's hostname; the parent emits one
       HTTPRoute rule per member. */ -}}
{{- $routeMembers := dict -}}
{{- range $iname, $icfg := .Values -}}
{{- if and (not (has $iname $knownKeys)) (kindIs "map" $icfg) -}}
{{- $r := $icfg.route | default dict -}}
{{- if $r.shareWith -}}
  {{- $parent := $r.shareWith | toString -}}
  {{- if eq $parent $iname -}}
    {{- fail (printf "instance %q: route.shareWith cannot reference itself" $iname) -}}
  {{- end -}}
  {{- $parentCfg := index $.Values $parent -}}
  {{- if or (has $parent $knownKeys) (not (kindIs "map" $parentCfg)) -}}
    {{- fail (printf "instance %q: route.shareWith: %q is not a defined instance" $iname $parent) -}}
  {{- end -}}
  {{- $parentRoute := $parentCfg.route | default dict -}}
  {{- if $parentRoute.shareWith -}}
    {{- fail (printf "instance %q: route.shareWith target %q is itself a shared child (no chains)" $iname $parent) -}}
  {{- end -}}
  {{- if $icfg.hostname -}}
    {{- fail (printf "instance %q: a shared child must not set its own hostname (host comes from %q)" $iname $parent) -}}
  {{- end -}}
  {{- $member := dict "service" (printf "%s-%s-svc" $.Release.Name $iname) -}}
  {{- if $r.pathPrefix -}}
    {{- if not (hasPrefix "/" ($r.pathPrefix | toString)) -}}
      {{- fail (printf "instance %q: route.pathPrefix %q must start with '/'" $iname $r.pathPrefix) -}}
    {{- end -}}
    {{- $_ := set $member "pathPrefix" $r.pathPrefix -}}
  {{- else if hasKey $r "weight" -}}
    {{- $_ := set $member "weight" $r.weight -}}
  {{- end -}}
  {{- $list := get $routeMembers $parent | default list -}}
  {{- $list = append $list $member -}}
  {{- $_ := set $routeMembers $parent $list -}}
{{- end -}}
{{- end -}}
{{- end -}}
{{- range $instanceName, $instanceCfg := .Values -}}
{{- if and (not (has $instanceName $knownKeys)) (kindIs "map" $instanceCfg) }}
{{- /* Resolve `inheritFrom`: deep-merge this instance ON TOP OF the named sibling
       so it overrides only the fields it declares. Single-level only (the target
       must not itself use inheritFrom) to keep resolution order-independent. */ -}}
{{- $base := dict -}}
{{- if hasKey $instanceCfg "inheritFrom" -}}
  {{- $parentName := $instanceCfg.inheritFrom | toString -}}
  {{- if eq $parentName $instanceName -}}
    {{- fail (printf "instance %q: inheritFrom cannot reference itself" $instanceName) -}}
  {{- end -}}
  {{- $parentCfg := index $.Values $parentName -}}
  {{- if not (kindIs "map" $parentCfg) -}}
    {{- fail (printf "instance %q: inheritFrom: %q is not a defined instance" $instanceName $parentName) -}}
  {{- end -}}
  {{- if hasKey $parentCfg "inheritFrom" -}}
    {{- fail (printf "instance %q: inheritFrom target %q must not itself use inheritFrom (no chains)" $instanceName $parentName) -}}
  {{- end -}}
  {{- $base = deepCopy $parentCfg -}}
{{- end -}}
{{- /* This instance's own fields win over the inherited base (deep merge). */ -}}
{{- $effective := mergeOverwrite $base (deepCopy $instanceCfg) -}}
{{- $_ := unset $effective "inheritFrom" -}}
{{- /* Merge shared service-level fields into the result (instance wins on conflict). */ -}}
{{- $merged := merge $effective $shared }}
{{- /* Resolve shared routing into the emitted spec: a child carries the parent's
       full BirService name in route.shareWith (operator then skips its own route);
       a parent carries the computed members. Drop any route that leaked via inheritFrom. */ -}}
{{- $_ := unset $merged "route" -}}
{{- $rawRoute := $instanceCfg.route | default dict -}}
{{- if $rawRoute.shareWith -}}
  {{- $_ := set $merged "route" (dict "shareWith" (printf "%s-%s" $.Release.Name ($rawRoute.shareWith | toString))) -}}
{{- else if hasKey $routeMembers $instanceName -}}
  {{- $_ := set $merged "route" (dict "members" (get $routeMembers $instanceName)) -}}
{{- end }}
---
apiVersion: deploy.easydeploy.io/v1alpha1
kind: BirService
metadata:
  name: {{ printf "%s-%s" $.Release.Name $instanceName | quote }}
  namespace: {{ $.Release.Namespace | quote }}
  labels:
{{ include "birservice.labels" $ | indent 4 }}
    deploy.easydeploy.io/instance: {{ $instanceName | quote }}
{{- if $owner }}
  annotations:
    deploy.easydeploy.io/owner: {{ $owner | quote }}
{{- end }}
spec:
{{ include "birservice.spec" $merged | indent 2 }}
{{- end -}}
{{- end -}}

{{- else -}}
---
apiVersion: deploy.easydeploy.io/v1alpha1
kind: BirService
metadata:
  name: {{ default .Release.Name .Values.name | quote }}
  namespace: {{ .Release.Namespace | quote }}
  labels:
{{ include "birservice.labels" . | indent 4 }}
{{- if $owner }}
  annotations:
    deploy.easydeploy.io/owner: {{ $owner | quote }}
{{- end }}
spec:
{{ include "birservice.spec" .Values | indent 2 }}
{{- end -}}
