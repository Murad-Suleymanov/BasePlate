apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  name: pools.deploy.easydeploy.io
  annotations:
    # Establish the CRD before any Pool CR in the same sync.
    argocd.argoproj.io/sync-wave: "-1"
spec:
  group: deploy.easydeploy.io
  scope: Cluster
  names:
    plural: pools
    singular: pool
    kind: Pool
    shortNames:
      - pool
  versions:
    - name: v1alpha1
      served: true
      storage: true
      additionalPrinterColumns:
        - name: NodeSelector
          type: string
          jsonPath: .spec.nodeSelector
        - name: Taints
          type: integer
          jsonPath: .spec.taints[*].key
      schema:
        openAPIV3Schema:
          type: object
          properties:
            apiVersion:
              type: string
            kind:
              type: string
            metadata:
              type: object
            spec:
              type: object
              properties:
                nodeSelector:
                  type: object
                  additionalProperties:
                    type: string
                  description: "Pins pods that select this pool to its nodes (e.g. {nodePool: system}). Empty means no node pinning."
                taints:
                  type: array
                  description: "Taints the pool's nodes carry; the operator injects a matching toleration onto every pod that selects this pool."
                  items:
                    type: object
                    required: ["key", "effect"]
                    properties:
                      key:
                        type: string
                      value:
                        type: string
                      effect:
                        type: string
                        enum: ["NoSchedule", "PreferNoSchedule", "NoExecute"]
