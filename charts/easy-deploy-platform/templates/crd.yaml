apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  name: {{ .Values.crd.name }}
spec:
  group: {{ .Values.crd.group }}
  scope: {{ .Values.crd.scope }}
  names:
    plural: {{ .Values.crd.names.plural }}
    singular: {{ .Values.crd.names.singular }}
    kind: {{ .Values.crd.names.kind }}
    shortNames:
{{- toYaml .Values.crd.names.shortNames | nindent 6 }}
  versions:
    - name: {{ .Values.crd.version }}
      served: true
      storage: true
      subresources:
        status: {}
      additionalPrinterColumns:
{{- toYaml .Values.crd.additionalPrinterColumns | nindent 8 }}
      schema:
        openAPIV3Schema:
          type: object
          properties:
            apiVersion:
              type: string
            kind:
              type: string
            metadata:
              type: object
            spec:
              type: object
              properties:
{{- range $key, $val := .Values.crd.specProperties }}
                {{ $key }}:
{{- toYaml $val | nindent 18 }}
{{- end }}
            status:
              type: object
              properties:
{{- range $key, $val := .Values.crd.statusProperties }}
                {{ $key }}:
{{- toYaml $val | nindent 18 }}
{{- end }}
