apiVersion: apps/v1
kind: Deployment
metadata:
  name: easy-deploy-operator
  namespace: {{ .Release.Namespace }}
  labels:
    app.kubernetes.io/name: easy-deploy-operator
spec:
  replicas: {{ .Values.operator.replicas }}
  selector:
    matchLabels:
      app.kubernetes.io/name: easy-deploy-operator
  template:
    metadata:
      labels:
        app.kubernetes.io/name: easy-deploy-operator
    spec:
      serviceAccountName: easy-deploy-operator
      containers:
        - name: manager
          image: {{ .Values.operator.image }}
          imagePullPolicy: Always
          args:
            - "--metrics-bind-address=:8080"
            - "--health-probe-bind-address=:8081"
          env:
            - name: ENVIRONMENT
              value: {{ .Values.environment | quote }}
            - name: BASE_DOMAIN
              value: {{ .Values.baseDomain | quote }}
            - name: TARGET_IP
              value: {{ .Values.targetIP | quote }}
            - name: REGISTRY_URL
              value: {{ .Values.registryURL | quote }}
            - name: WEBHOOK_URL
              value: "https://{{ .Values.webhookHostname }}"
          envFrom:
            - secretRef:
                name: github-pipeline-secret
                optional: true
          ports:
            - name: metrics
              containerPort: 8080
            - name: health
              containerPort: 8081
            - name: webhook
              containerPort: 9090
          livenessProbe:
            httpGet:
              path: /healthz
              port: health
          readinessProbe:
            httpGet:
              path: /readyz
              port: health
