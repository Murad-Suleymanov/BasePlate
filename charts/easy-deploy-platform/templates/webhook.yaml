apiVersion: v1
kind: Service
metadata:
  name: easy-deploy-webhook
  namespace: {{ .Release.Namespace }}
  labels:
    app.kubernetes.io/name: easy-deploy-operator
spec:
  selector:
    app.kubernetes.io/name: easy-deploy-operator
  ports:
    - name: webhook
      port: 9090
      targetPort: 9090
      protocol: TCP
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: webhook-route
  namespace: {{ .Release.Namespace }}
  annotations:
    external-dns.alpha.kubernetes.io/target: {{ .Values.targetIP | quote }}
spec:
  parentRefs:
    - name: main-gateway
      namespace: nginx-gateway
      sectionName: https
  hostnames:
    - {{ .Values.webhookHostname }}
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /webhook
      backendRefs:
        - name: easy-deploy-webhook
          port: 9090
