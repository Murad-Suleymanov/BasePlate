name: easy-deploy-operator

istio:
  enabled: false

operator:
  containerName: manager
  image: ghcr.io/murad-suleymanov/easy-deploy-operator:680036ddd138c9538120c078cc64f84855de61f9
  imagePullPolicy: Always
  replicas: 1

  args:
    metricsBindAddress:
      enabled: true
      value: ":8080"
    healthProbeBindAddress:
      enabled: true
      value: ":8081"
  extraArgs: []

  env:
    environment:
      enabled: true
      value: prod
    baseDomain:
      enabled: true
      value: easysolution.work
    targetIP:
      enabled: true
      value: ""
    registryURL:
      enabled: true
      value: ""
    webhookURL:
      enabled: true
      value: ""
  extraEnv: []

  envFrom:
    githubPipelineSecret:
      enabled: true
      name: github-pipeline-secret
      optional: true
  extraEnvFrom: []

  ports:
    metrics:
      enabled: true
      containerPort: 8080
    health:
      enabled: true
      containerPort: 8081
    webhook:
      enabled: true
      containerPort: 9090
  extraPorts: []

  probes:
    liveness:
      enabled: true
      path: /healthz
      port: health
    readiness:
      enabled: true
      path: /readyz
      port: health

webhook:
  enabled: true
  service:
    name: easy-deploy-webhook
    port: 9090
    targetPort: 9090
  route:
    name: webhook-route
    targetIP: ""
    hostname: ""
    pathPrefix: /webhook
  gateway:
    name: main-gateway
    namespace: nginx-gateway
    sectionName: https

rbac:
  clusterRole:
    name: easy-deploy-operator
    rules:
      birservices:
        enabled: true
        apiGroups: ["deploy.easydeploy.io"]
        resources: ["birservices"]
        verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
      birservicesStatus:
        enabled: true
        apiGroups: ["deploy.easydeploy.io"]
        resources: ["birservices/status"]
        verbs: ["get", "update", "patch"]
      deployments:
        enabled: true
        apiGroups: ["apps"]
        resources: ["deployments"]
        verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
      hpa:
        enabled: true
        apiGroups: ["autoscaling"]
        resources: ["horizontalpodautoscalers"]
        verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
      servicesSecrets:
        enabled: true
        apiGroups: [""]
        resources: ["services", "secrets"]
        verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
      # mesh rollout: Pod list (controller-runtime cache cluster-wide Pod watch)
      pods:
        enabled: true
        apiGroups: [""]
        resources: ["pods"]
        verbs: ["get", "list", "watch"]
      # waypoint Gateway options ConfigMap (namespace_istio.go upsertWaypointOptions).
      # Required cluster-wide so the controller-runtime cache can watch ConfigMaps;
      # without it the cache informer fails and every reconcile that touches the
      # waypoint ConfigMap blocks (mesh-enabled services never get a Deployment).
      configmaps:
        enabled: true
        apiGroups: [""]
        resources: ["configmaps"]
        verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
      jobs:
        enabled: true
        apiGroups: ["batch"]
        resources: ["jobs"]
        verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
      httproutes:
        enabled: true
        apiGroups: ["gateway.networking.k8s.io"]
        resources: ["httproutes"]
        verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
      gateways:
        enabled: true
        apiGroups: ["gateway.networking.k8s.io"]
        resources: ["gateways"]
        verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
      servicemonitors:
        enabled: true
        apiGroups: ["monitoring.coreos.com"]
        resources: ["servicemonitors"]
        verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
      envoyfilters:
        enabled: true
        apiGroups: ["networking.istio.io"]
        resources: ["envoyfilters"]
        verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
      destinationrules:
        enabled: true
        apiGroups: ["networking.istio.io"]
        resources: ["destinationrules"]
        verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
      namespaces:
        enabled: true
        apiGroups: [""]
        resources: ["namespaces"]
        verbs: ["get", "list", "watch", "update", "patch"]
    extraRules: []
  clusterRoleBinding:
    name: easy-deploy-operator
  argocdRole:
    name: easy-deploy-read-argocd-repos
    namespace: argocd
    rules:
      secrets:
        enabled: true
        apiGroups: [""]
        resources: ["secrets"]
        verbs: ["get", "list"]
    extraRules: []
  argocdRoleBinding:
    name: easy-deploy-read-argocd-repos

crd:
  name: birservices.deploy.easydeploy.io
  group: deploy.easydeploy.io
  scope: Namespaced
  names:
    plural: birservices
    singular: birservice
    kind: BirService
    shortNames:
      - bs
  version: v1alpha1
  additionalPrinterColumns:
    - name: Repo
      type: string
      jsonPath: .spec.repo
    - name: Image
      type: string
      jsonPath: .spec.image
    - name: Port
      type: integer
      jsonPath: .spec.port
    - name: Hostname
      type: string
      jsonPath: .spec.hostname
    - name: Available
      type: integer
      jsonPath: .status.availableReplicas
    - name: Build
      type: string
      jsonPath: .status.buildStatus
  specProperties:
    image:
      type: string
    repo:
      type: string
    tag:
      type: string
    imageTag:
      type: string
      description: "Rollback override — previous build SHA (e.g. abc1234)."
    dockerfile:
      type: string
    injectPipeline:
      type: boolean
      description: "When true, adds GitHub Actions build workflow to the repo. Requires GITHUB_TOKEN."
    replicas:
      type: integer
      format: int32
      minimum: 0
      description: "Ignored when spec.hpa.minReplicas/maxReplicas are set."
    hpa:
      type: object
      description: "HPA format."
      properties:
        minReplicas:
          type: integer
          format: int32
          minimum: 1
        maxReplicas:
          type: integer
          format: int32
          minimum: 1
        targetRPS:
          type: integer
          format: int32
          minimum: 1
          description: "Legacy RPS knob (equivalent to scaleType: rps). Prefer scaleType. Requires spec.traffic."
        scaleType:
          type: string
          enum: ["cpu", "memory", "rps", "worker"]
          description: "The single signal the HPA scales on. cpu/memory/worker = utilization %; rps = Istio requests/sec per pod (integer, needs spec.traffic). worker = worker-pool saturation % (needs spec.metrics). Omit to default to CPU 80%."
        target:
          type: integer
          format: int32
          minimum: 1
          description: "Per-pod target for scaleType. cpu/memory/worker: utilization % (defaults to 80). rps: requests/sec per pod (integer, required)."
    resources:
      type: object
      description: "Container resource requests/limits."
      properties:
        requests:
          type: object
          properties:
            memory:
              type: string
            cpu:
              type: string
        limits:
          type: object
          properties:
            memory:
              type: string
            cpu:
              type: string
    port:
      type: integer
      format: int32
      minimum: 1
      maximum: 65535
    containerPort:
      type: integer
      format: int32
      minimum: 1
      maximum: 65535
    hostname:
      type: string
    hostnames:
      type: array
      items:
        type: string
      description: "Additional public DNS aliases served by the same workload (one HTTPRoute, multiple hostnames). external-dns creates a record for each; all share the same pods and rate limit."
    expose:
      type: boolean
      description: "If false, no HTTPRoute/DNS (internal only). Default true."
    metrics:
      type: object
      properties:
        enabled:
          type: boolean
        path:
          type: string
          description: "Metrics HTTP path, default /metrics"
    traffic:
      type: object
      description: "Mesh traffic; presence implies mesh. provider istio (default). rateLimit local creates EnvoyFilter."
      properties:
        provider:
          type: string
        rateLimit:
          type: object
          properties:
            enabled:
              type: boolean
            mode:
              type: string
            local:
              type: object
              properties:
                requestsPerSecond:
                  type: integer
                  format: int32
                  minimum: 1
                burst:
                  type: integer
                  format: int32
                  minimum: 0
        ejectUnhealthy:
          type: boolean
          description: "Outlier detection on/off (default true). Set false for workloads that legitimately return 5xx."
        latencyAware:
          type: boolean
          description: "LB algorithm. Default false (round-robin). True switches to least-request, useful when request latency is heterogeneous (cache hits vs DB calls). Verify with P50/P99 histograms before enabling."
    readinessProbe:
      type: object
      description: "HTTP readiness probe. Port defaults to container port."
      properties:
        path:
          type: string
        port:
          type: integer
          format: int32
          minimum: 1
          maximum: 65535
    livenessProbe:
      type: object
      description: "HTTP liveness probe. Port defaults to container port."
      properties:
        path:
          type: string
        port:
          type: integer
          format: int32
          minimum: 1
          maximum: 65535
    singleton:
      type: boolean
      description: "App can only run one version at a time (leader-elected job, exclusive lock, in-memory state). Default false → zero-downtime rolling deploy. True → old pods fully stop before new ones start (brief downtime), PDB skipped."
    maxDown:
      type: integer
      format: int32
      minimum: 0
      description: "Maximum pods that may go down simultaneously during voluntary disruptions (node drains, upgrades). Default floor(replicas/2). Set lower for latency-critical apps. 0 forbids voluntary disruption (blocks node drains)."
    canary:
      type: object
      description: "Canary deployment with weighted HTTPRoute traffic splitting. Remove or set enabled=false to tear down."
      properties:
        enabled:
          type: boolean
        weight:
          type: integer
          format: int32
          minimum: 0
          maximum: 100
          description: "Percentage of traffic routed to canary (0-100). Default 10."
        image:
          type: string
          description: "Fully-qualified canary image. If empty, derived from spec.image + tag."
        tag:
          type: string
          description: "Image tag override for canary (e.g. v2.0.0-rc1)."
    shutdown:
      type: object
      description: "Graceful termination tuning. terminationGracePeriodSeconds = preStopSleepSeconds + drainBufferSeconds."
      properties:
        preStopSleepSeconds:
          type: integer
          format: int32
          minimum: 0
          maximum: 600
          description: "Seconds the container sleeps before SIGTERM (drains endpoints from kube-proxy/Istio xDS/Gateway). Default 15."
        drainBufferSeconds:
          type: integer
          format: int32
          minimum: 0
          maximum: 600
          description: "Post-SIGTERM budget for in-flight requests to finish before SIGKILL. Default 5. Increase for long requests (uploads, streaming)."
    route:
      type: object
      description: "Chart-resolved pool routing. Instances sharing a group share one Service (load-balanced pod pool); the primary owns the Service + HTTPRoutes."
      properties:
        group:
          type: string
          description: "Pool identifier; the pool Service selects the route-group pod label = this value."
        primary:
          type: boolean
          description: "Whether this instance owns the pool's Service and HTTPRoutes. Non-primary members only contribute pods."
        entries:
          type: array
          description: "Named HTTP front doors (one HTTPRoute each). Set only on the primary."
          items:
            type: object
            required: [name]
            properties:
              name:
                type: string
                description: "Route name (e.g. main, main_slow)."
              hostname:
                type: string
                description: "Hostname this route is served on. Empty → operator auto-derives."
              timeout:
                type: string
                description: "Per-request timeout (e.g. 15s)."
              retries:
                type: integer
                format: int32
                minimum: 0
                description: "HTTP retry count."
  statusProperties:
    availableReplicas:
      type: integer
      format: int32
    buildImage:
      type: string
    buildStatus:
      type: string
    buildTag:
      type: string
    lastRebuild:
      type: string
    stableTag:
      type: string
      description: "Image tag locked as stable when canary was enabled. Cleared on promotion."
    canaryImage:
      type: string
      description: "Full image URL of the active canary deployment."
